name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build and test both debug variants (applicationIdSuffix .debug)
      run: >-
        ./gradlew
        :app:assembleStandardDebug
        :app:testStandardDebugUnitTest
        :app:assemblePersonalDebug
        :app:testPersonalDebugUnitTest
    - name: Upload standard debug APK
      uses: actions/upload-artifact@v4
      with:
        name: standard-debug-apk
        path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
    - name: Upload personal debug APK
      uses: actions/upload-artifact@v4
      with:
        name: personal-debug-apk
        path: app/build/outputs/apk/personal/debug/app-personal-debug.apk

  sign:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: sign-release
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare signing keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: echo "$ANDROID_SIGNING_KEY" | base64 --decode > release.keystore
      - name: Build both signed variants
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:assembleStandardRelease
          :app:bundleStandardRelease
          :app:assemblePersonalRelease
          :app:bundlePersonalRelease
      - name: Upload standard signed APK
        uses: actions/upload-artifact@v4
        with:
          name: standard-release-apk
          path: app/build/outputs/apk/standard/release/app-standard-release.apk
      - name: Upload personal signed APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-release-apk
          path: app/build/outputs/apk/personal/release/app-personal-release.apk
      - name: Upload standard signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: standard-release-aab
          path: app/build/outputs/bundle/standardRelease/app-standard-release.aab
      - name: Upload personal signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: personal-release-aab
          path: app/build/outputs/bundle/personalRelease/app-personal-release.aab
